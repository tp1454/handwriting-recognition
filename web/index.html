<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Handwriting Sheet Scorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="layout">
    <section class="card card-input">
      <h1>Handwriting Sheet Scorer</h1>
      <p class="subtitle">Upload your handwriting sheet and get row-level similarity scoring.</p>

      <form id="score-form" class="form">
        <label class="field">
          <span>Handwriting sheet image</span>
          <input id="sheet-file" name="file" type="file" accept="image/*" required />
        </label>

        <label class="overlay-toggle" for="show-overlay">
          <input id="show-overlay" type="checkbox" />
          <span>Show extracted boxes overlay</span>
        </label>

        <button id="submit-btn" type="submit">Score Sheet</button>
      </form>

      <p id="status" class="status" role="status"></p>
    </section>

    <section class="card card-preview">
      <h2>Preview</h2>
      <div class="preview-wrap">
        <div id="preview-canvas" class="preview-canvas">
          <img id="preview-image" alt="Uploaded handwriting sheet preview" />
          <div id="box-overlay" class="box-overlay"></div>
        </div>
        <p id="preview-empty">No image selected yet.</p>
      </div>
    </section>

    <section class="card card-results">
      <h2>Results</h2>
      <div id="summary" class="summary hidden"></div>
      <div class="table-wrap hidden" id="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Row</th>
              <th>Label</th>
              <th>Split Count</th>
              <th>Row Score</th>
              <th>Comparison Scores (vs split[0])</th>
            </tr>
          </thead>
          <tbody id="rows-body"></tbody>
        </table>
      </div>
      <p id="results-empty" class="empty">Submit a sheet to see scores.</p>
    </section>
  </main>

  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
